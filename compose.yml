services:
  dev:
    container_name: poppy-dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    working_dir: "${PWD:-/workspace}"
    networks:
      - internal
    environment:
      BUILD_JOBS: "${POPPY_BUILD_JOBS:-2}"
    volumes:
      - type: bind
        source: .
        target: "${PWD:-/workspace}"
        read_only: true
      - type: bind
        source: ./out/docker
        target: /output
      - type: volume
        source: build-cache
        target: /build
    command: ["sleep", "infinity"]

networks:
  internal:
    internal: true

volumes:
  build-cache:
